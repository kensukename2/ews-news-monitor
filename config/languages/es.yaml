# Spanish language configuration.
# fold_accents: true means "inundacion" and "inundación" both match.
code: es
name: Español (Spanish)
word_boundaries: true
fold_accents: true

prefilter:
  strong_terms:
    - alerta temprana
    - alertas tempranas
    - sistema de alerta temprana
    - aviso meteorológico
    - alerta roja
    - alerta naranja
    - evacuación preventiva
    - evacuaciones preventivas
    - acción anticipatoria
    - acciones anticipatorias
    - aviso de huracán
    - alerta de tsunami
    - aviso rojo
    - nivel rojo
    - nivel naranja
  warning_terms:
    - alerta
    - alertas
    - aviso
    - avisos
    - advertencia
    - pronóstico
    - pronostica
    - boletín
    - evacuación
    - evacuaciones
    - evacuados
    - evacuar
    - albergues
    - protección civil
    - defensa civil
    - meteorológico
    - meteorología
    - sin víctimas
    - preparación
  hazard_terms:
    - huracán
    - tormenta tropical
    - ciclón
    - inundación
    - inundaciones
    - crecida
    - desborde
    - desbordamiento
    - lluvias intensas
    - lluvias fuertes
    - fuertes lluvias
    - aguacero
    - ola de calor
    - calor extremo
    - sequía
    - tormenta
    - tornado
    - granizo
    - deslizamiento
    - deslizamientos
    - huaico
    - huaicos
    - alud
    - tsunami
    - marejada
    - incendio forestal
    - incendios forestales
    - helada
    - heladas
    - ola de frío
    - nevada
    - frente frío
    - DANA
    - sismo
    - terremoto
    - erupción
    - volcán
  exclude_terms:
    - alerta sanitaria
    - alerta alimentaria
    - bolsa de valores
    - futbol
    - fútbol
    - alerta amber

gdelt:
  sourcelang: spanish
  queries:
    - '("early warning" OR "red alert" OR "orange alert" OR evacuation OR "preventive evacuation") (hurricane OR flood OR "heavy rain" OR landslide OR tsunami OR heatwave OR storm)'

# Claude web search queries (one search, about $0.011, per query per run).
# Placeholders: {today}, {month_en}, {month_ja}, {month_es}
web_search:
  queries:
    - "noticias {month_es} alerta roja OR alerta temprana OR evacuación preventiva lluvias OR huracán OR inundación"
