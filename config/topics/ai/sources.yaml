# AI News sources, grouped by language. Same fields as
# config/topics/ews/sources.yaml (see the explanation at the top of that file).
#
# Most sources here are broad (tech news, all agency news), so they use the
# strict pre-filter: an AI term AND a weather/water/climate/EWS term.
# Feeds that EWS News also reads are downloaded only once per run.
#
# Test all feeds with:  python -m ews_news --topic ai check-sources --all

international:
  - id: wmo_press
    name: WMO press releases
    type: html_links
    url: https://wmo.int/news/media-centre
    link_pattern: '^/news/media-centre/(?!information-journalists)[a-z0-9-]{15,}'
    strip_pattern: '^Press Release \d{1,2} \w+ \d{4}\s*'
    language: en
    prefilter: strict
    agency_type: international
    enabled: true

  - id: wmo_news
    name: WMO news
    type: html_links
    url: https://wmo.int/news
    link_pattern: '^/media/news/[a-z0-9-]{10,}'
    strip_pattern: '^News \d{1,2} \w+ \d{4}\s*'
    language: en
    prefilter: strict
    agency_type: international
    enabled: true

  - id: ecmwf
    name: ECMWF news
    type: rss
    url: https://www.ecmwf.int/rss.xml
    language: en
    prefilter: loose          # ECMWF news is all meteorology: one AI term is enough
    agency_type: international
    enabled: true

  - id: eumetsat
    name: EUMETSAT news
    type: rss
    url: https://www.eumetsat.int/rss.xml
    language: en
    prefilter: loose
    agency_type: international
    enabled: true

  - id: itu_ai4good
    name: ITU AI for Good
    type: rss
    url: https://aiforgood.itu.int/feed/
    language: en
    prefilter: strict
    agency_type: international
    enabled: true

  - id: preventionweb
    name: PreventionWeb
    type: rss
    url: https://www.preventionweb.net/rss.xml
    language: en
    prefilter: loose
    agency_type: international
    enabled: true

  - id: undrr
    name: UNDRR news
    type: rss
    url: https://www.undrr.org/rss.xml
    language: en
    prefilter: loose
    agency_type: international
    enabled: true

  - id: reliefweb_ai
    name: ReliefWeb ("artificial intelligence")
    type: rss
    url: https://reliefweb.int/updates/rss.xml?search=%22artificial%20intelligence%22
    language: en
    prefilter: strict
    agency_type: international
    enabled: true

