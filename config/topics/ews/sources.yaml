# News sources, grouped by language.
#
# Fields:
#   id           unique short identifier (used in logs and the database)
#   name         display name
#   type         rss          RSS/Atom feed (preferred)
#                gdelt        GDELT DOC API, queries from languages/<lang>.yaml in this folder
#                claude_search  Claude web search, queries from languages/<lang>.yaml in this folder
#                html_links   news list page of a site without a feed (see link_pattern)
#                jma_press    気象庁 press release list
#   url          feed or page URL
#   language     en | ja | es
#   prefilter    strict  = keyword rules must match (broad feeds, e.g. all NHK news)
#                loose   = title/snippet needs at least one warning or hazard term
#                relaxed = only exclude rules apply (sources that are already
#                          keyword-searched by a model, e.g. Claude web search)
#   require_any  optional list: keep only items containing one of these words
#   exclude_any  optional list: drop items containing one of these words
#   link_pattern html_links only: regular expression matched against link paths
#   strip_pattern html_links only: optional regex removed from link titles
#   agency_type  NMHS | RSMC | other_national_agency | international | NGO | media
#   enabled      true / false
#   notes        free text (e.g. why a source is disabled)
#
# Test all feeds with:  python -m ews_news check-sources --all

international:
  - id: gdacs
    name: GDACS
    type: rss
    url: https://www.gdacs.org/xml/rss.xml
    language: en
    prefilter: relaxed
    require_any: [orange, red]          # skip routine "Green" notifications
    agency_type: international
    enabled: true

  - id: reliefweb_ew_en
    name: ReliefWeb ("early warning")
    type: rss
    url: https://reliefweb.int/updates/rss.xml?search=%22early%20warning%22
    language: en
    prefilter: loose
    agency_type: international
    enabled: true

  - id: reliefweb_ew_es
    name: ReliefWeb ("alerta temprana")
    type: rss
    url: https://reliefweb.int/updates/rss.xml?search=%22alerta%20temprana%22
    language: es
    prefilter: loose
    agency_type: international
    enabled: true

  - id: reliefweb_api
    name: ReliefWeb API
    type: reliefweb
    language: en
    agency_type: international
    enabled: false
    notes: "API requires an approved appname (https://apidoc.reliefweb.int/parameters#appname). RSS search feeds above are used meanwhile."

  - id: preventionweb
    name: PreventionWeb
    type: rss
    url: https://www.preventionweb.net/rss.xml
    language: en
    prefilter: loose
    agency_type: international
    enabled: true

  - id: undrr
    name: UNDRR news
    type: rss
    url: https://www.undrr.org/rss.xml
    language: en
    prefilter: loose
    agency_type: international
    enabled: true

  - id: wmo_press
    name: WMO press releases
    type: html_links
    url: https://wmo.int/news/media-centre
    link_pattern: '^/news/media-centre/(?!information-journalists)[a-z0-9-]{15,}'
    strip_pattern: '^Press Release \d{1,2} \w+ \d{4}\s*'
    language: en
    prefilter: loose
    agency_type: international
    enabled: true
    notes: "No RSS feed; also covers Early Warnings for All announcements."

  - id: wmo_news
    name: WMO news
    type: html_links
    url: https://wmo.int/news
    link_pattern: '^/media/news/[a-z0-9-]{10,}'
    strip_pattern: '^News \d{1,2} \w+ \d{4}\s*'
    language: en
    prefilter: loose
    agency_type: international
    enabled: true

