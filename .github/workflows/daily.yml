# Republish knaito.xyz after code changes.
#
# The daily pipeline runs on the Hetzner server (scripts/server_run.sh,
# started by deploy/ews-news.timer at 05:00 Europe/Zurich). The server saves
# its state to the `data` branch and publishes the site to the `gh-pages`
# branch, which GitHub Pages serves.
#
# This workflow does NOT collect or classify news. It only rebuilds the page
# data from the saved state and republishes the site, so that changes to the
# pages (site/) or code are visible without waiting for the next daily run.
# * Push to main: runs automatically.
# * Manual: Actions tab -> "Republish site" -> Run workflow.
name: Republish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # push to the gh-pages branch

concurrency:
  group: ews-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check out the saved state (data branch) into state/
        run: |
          git fetch --depth=1 origin data:data
          git worktree add state data

      - name: Rebuild page data from the saved state
        run: python -m ews_news publish

      - name: Publish to gh-pages
        run: scripts/publish_pages.sh
